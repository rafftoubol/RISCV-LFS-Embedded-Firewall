# Note: Buildroot's and Meson's terminologies differ about the meaning
# of 'build', 'host' and 'target':
# - Buildroot's 'host' is Meson's 'build'
# - Buildroot's 'target' is Meson's 'host'

[binaries]
c = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/bin/riscv64-buildroot-linux-musl-gcc'
cpp = '/bin/false'
ar = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/bin/riscv64-buildroot-linux-musl-gcc-ar'
strip = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/bin/riscv64-buildroot-linux-musl-strip'
cmake = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/bin/cmake'
fortran = '/bin/false'
pkg-config = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/bin/pkgconf'
g-ir-compiler = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot/usr/bin/g-ir-compiler'
g-ir-scanner = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot/usr/bin/g-ir-scanner'

[built-in options]
c_args = ['-D_LARGEFILE_SOURCE', '-D_LARGEFILE64_SOURCE', '-D_FILE_OFFSET_BITS=64', '-O2', '-g0']
c_link_args = ['-ztext']
cpp_args = ['-D_LARGEFILE_SOURCE', '-D_LARGEFILE64_SOURCE', '-D_FILE_OFFSET_BITS=64', '-O2', '-g0']
cpp_link_args = ['-ztext']
fortran_args = ['-O2', '-g0']
fortran_link_args = ['-ztext']
wrap_mode = 'nodownload'
cmake_prefix_path = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot/usr/lib/cmake'

[properties]
needs_exe_wrapper = true
sys_root = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot'
pkg_config_libdir = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot/usr/lib/pkgconfig:/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/riscv64-buildroot-linux-musl/sysroot/usr/share/pkgconfig'
pkg_config_static = 'false'
# enable meson build to pass a toolchain file to cmake
cmake_toolchain_file = '/home/raph/riscv-work/riscv64-buildroot-linux-musl_sdk-buildroot/share/buildroot/toolchainfile.cmake'
cmake_defaults = false

[host_machine]
system = 'linux'
cpu_family = 'riscv64'
cpu = ''
endian = 'little'
